<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IETS — Gestión Integral</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--bg:#F4F5F7;--bg2:#EEF0F4;--card:#FFFFFF;
  --border:#E2E5EB;--border2:#D0D4DC;
  --text:#1A1D26;--text2:#4A5068;--text3:#7C829A;--text4:#A8ADBF;
  --accent:#2563EB;--accent2:#1D4ED8;--accent-bg:#EFF6FF;--accent-border:#BFDBFE;
  --green:#059669;--green-bg:#ECFDF5;--green-border:#A7F3D0;
  --yellow:#D97706;--yellow-bg:#FFFBEB;--yellow-border:#FDE68A;
  --red:#DC2626;--red-bg:#FEF2F2;--red-border:#FECACA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-border:#DDD6FE;
  --teal:#0D9488;--teal-bg:#F0FDFA;
  --orange:#EA580C;--orange-bg:#FFF7ED;
  --r:8px;--r2:12px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow2:0 4px 12px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
h1,h2,h3{font-family:'Libre Baskerville',Georgia,serif;letter-spacing:-.3px;font-weight:700;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.sb ::-webkit-scrollbar-thumb{background:#2A2F52;}
.sb ::-webkit-scrollbar-track{background:#0F1117;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#EFF6FF 0%,#F0FDFA 50%,#F5F3FF 100%);}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;max-width:420px;width:92%;text-align:center;box-shadow:var(--shadow2);}
.login-card .logo{width:56px;height:56px;background:var(--accent);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:'Libre Baskerville',serif;font-size:20px;margin-bottom:20px;}
.login-card h1{font-size:22px;margin-bottom:4px;}
.login-card p{color:var(--text3);font-size:13px;margin-bottom:28px;line-height:1.6;}
.g-btn{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff;color:#3c4043;border:1px solid var(--border);border-radius:8px;padding:12px 24px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;width:100%;transition:all .15s;}
.g-btn:hover{background:var(--bg);border-color:var(--border2);box-shadow:var(--shadow);}
.g-btn svg{width:18px;height:18px;}
.login-card .hint{margin-top:14px;font-size:11px;color:var(--text4);}
.login-card .hint b{color:var(--accent);}

/* DEMO SELECTOR */
.demo-sel{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);text-align:left;}
.demo-sel label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.demo-sel select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);font-family:inherit;font-size:13px;background:#fff;color:var(--text);outline:none;}
.demo-sel select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}

/* APP */
#app{display:none;min-height:100vh;}
#app.on{display:flex;}

/* SIDEBAR — Dark panel */
.sb{width:250px;background:#0F1117;border-right:1px solid #1E2240;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .25s;}
.sb-top{padding:18px 16px;border-bottom:1px solid #1E2240;display:flex;align-items:center;gap:10px;}
.sb-top .ico{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#0D9488);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Libre Baskerville',serif;font-size:14px;font-weight:700;}
.sb-top .t{font-size:14px;font-weight:700;color:#E8E9F0;}
.sb-top .s{font-size:10px;color:#5C6080;}
.sb-menu{flex:1;overflow-y:auto;padding:10px 8px;}
.sb-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#5C6080;padding:14px 10px 5px;}
.sb-it{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;color:#8B8FA8;transition:all .12s;margin-bottom:1px;border:1px solid transparent;}
.sb-it:hover{background:#1A1D27;color:#E8E9F0;}
.sb-it.on{background:rgba(99,102,241,0.12);color:#818CF8;border-color:rgba(99,102,241,0.2);font-weight:600;}
.sb-it .ic{width:18px;text-align:center;font-size:13px;}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:16px;text-align:center;}
.sb-bot{padding:14px 12px;border-top:1px solid #1E2240;display:flex;align-items:center;gap:8px;}
.av{border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}
.sb-bot .info{flex:1;min-width:0;}
.sb-bot .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#E8E9F0;}
.sb-bot .rl{font-size:10px;color:#5C6080;}
.lo{background:none;border:none;color:#5C6080;cursor:pointer;padding:5px;border-radius:5px;font-size:14px;transition:all .12s;}
.lo:hover{color:#F87171;background:rgba(248,113,113,0.1);}

/* MAIN */
.mn{margin-left:250px;flex:1;min-height:100vh;}
.mn-hd{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--card);position:sticky;top:0;z-index:50;}
.mn-hd h1{font-size:18px;}
.mn-hd .sub{font-size:12px;color:var(--text3);margin-top:1px;font-family:'Source Sans 3',sans-serif;font-weight:400;}
.hd-acts{display:flex;gap:6px;align-items:center;}

/* BTNS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .12s;border:1px solid transparent;white-space:nowrap;}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-p:hover{background:var(--accent2);}
.btn-s{background:#fff;color:var(--text2);border-color:var(--border);}
.btn-s:hover{background:var(--bg);border-color:var(--border2);}
.btn-g{background:transparent;color:var(--text3);padding:6px 8px;}
.btn-g:hover{color:var(--text);background:var(--bg);}
.btn-d{background:var(--red);color:#fff;}
.btn-d:hover{opacity:.9;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-green{background:var(--green);color:#fff;}

/* PAGE */
.pg-ct{padding:20px 24px;}
#pageContainer .pg{display:none;}
#pageContainer .pg.on{display:block;animation:pgIn .2s ease;}
@keyframes pgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow);}
.card-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-h h3{font-size:14px;}
.card-b{padding:16px 18px;}

/* STATS */
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px;}
.st{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow);transition:transform .12s;}
.st:hover{transform:translateY(-1px);}
.st-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:10px;}
.st-v{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.st-l{font-size:11px;color:var(--text3);margin-top:3px;}

/* TABLE */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--bg);}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:var(--bg);}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:10px 12px;font-size:13px;vertical-align:middle;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border);}
.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.b-blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);}
.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border);}
.b-muted{background:var(--bg2);color:var(--text3);border:1px solid var(--border);}

/* PROGRESS */
.prog{display:flex;align-items:center;gap:6px;}
.prog-bar{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;min-width:50px;}
.prog-fill{height:100%;border-radius:3px;transition:width .4s;}
.prog-txt{font-size:11px;font-weight:700;min-width:30px;text-align:right;}

/* MODAL */
.mdl-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(2px);z-index:200;align-items:flex-start;justify-content:center;padding-top:5vh;overflow-y:auto;}
.mdl-ov.on{display:flex;}
.mdl{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);width:92%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.15);margin-bottom:5vh;}
.mdl-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.mdl-hd h3{font-size:16px;}
.mdl-x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px;}
.mdl-x:hover{background:var(--bg);color:var(--text);}
.mdl-bd{padding:20px 22px;}
.mdl-ft{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:6px;border-top:1px solid var(--border);}

/* FORM */
.fg{margin-bottom:14px;}
.fg>label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:4px;}
.fg .req{color:var(--red);}
.fi,.fsel,.fta{width:100%;background:#fff;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--r);font-size:13px;font-family:inherit;outline:none;transition:border .12s,box-shadow .12s;}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
.fta{resize:vertical;min-height:64px;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.range-wrap{display:flex;align-items:center;gap:8px;}
.range-wrap input[type=range]{flex:1;accent-color:var(--accent);}
.range-wrap .rv{font-weight:700;min-width:34px;text-align:right;font-size:13px;}

/* SEARCH */
.search{background:#fff;border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:var(--r);font-size:12px;font-family:inherit;outline:none;width:200px;transition:border .12s;}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg2);border-radius:var(--r);padding:3px;margin-bottom:16px;border:1px solid var(--border);overflow-x:auto;}
.tab{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .12s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.on{background:var(--accent);color:#fff;}
.tab-sec{display:none;}
.tab-sec.on{display:block;}

/* TOAST */
.toast-c{position:fixed;top:14px;right:14px;z-index:500;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow2);font-size:12px;font-weight:500;animation:toastIn .25s;}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast.s{border-left:3px solid var(--green);}
.toast.e{border-left:3px solid var(--red);}
.toast.i{border-left:3px solid var(--accent);}
.toast.w{border-left:3px solid var(--yellow);}

/* ORG */
.dept-block{margin-bottom:16px;}
.dept-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);cursor:pointer;transition:all .12s;box-shadow:var(--shadow);}
.dept-head:hover{border-color:var(--accent);}
.dept-head .d-icon{font-size:18px;}
.dept-head .d-info{flex:1;}
.dept-head .d-info h4{font-size:13px;font-weight:700;font-family:'Source Sans 3',sans-serif;}
.dept-head .d-info span{font-size:11px;color:var(--text3);}
.dept-head .d-count{font-size:18px;font-weight:800;color:var(--accent);}
.dept-users{padding:8px 0 0 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:6px;}
.u-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);transition:all .12s;cursor:pointer;}
.u-card:hover{border-color:var(--accent);box-shadow:var(--shadow);}
.u-card .u-nm{font-size:12px;font-weight:600;}
.u-card .u-pos{font-size:10px;color:var(--text3);}
.u-card .u-pct{font-size:16px;font-weight:800;min-width:40px;text-align:right;}

/* OBJ CARD */
.obj{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;border-left:4px solid var(--border);}
.obj.pri-a{border-left-color:var(--red);}
.obj.pri-m{border-left-color:var(--yellow);}
.obj.pri-b{border-left-color:var(--green);}
.obj h4{font-size:13px;font-weight:700;margin-bottom:6px;font-family:'Source Sans 3',sans-serif;}
.obj-meta{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}

/* MEETING */
.meet{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
.meet h4{font-size:13px;font-weight:700;margin-bottom:6px;font-family:'Source Sans 3',sans-serif;}
.meet-items{list-style:none;margin-top:8px;}
.meet-items li{padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;align-items:center;gap:7px;}
.meet-items li:last-child{border-bottom:none;}
.chk{width:16px;height:16px;border-radius:4px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;flex-shrink:0;transition:all .12s;}
.chk.on{background:var(--green);border-color:var(--green);color:#fff;}
.chk:hover{border-color:var(--accent);}

/* EVAL CARD */
.ev{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow);}
.ev-score{font-size:32px;font-weight:800;line-height:1;}
.ev-dim{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.ev-dim span:first-child{min-width:90px;font-size:11px;color:var(--text2);}

/* RANK */
.rank-it{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);transition:background .1s;}
.rank-it:hover{background:var(--bg);}
.rank-it:last-child{border-bottom:none;}
.rank-pos{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.rk-1{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;}
.rk-2{background:linear-gradient(135deg,#9CA3AF,#6B7280);color:#fff;}
.rk-3{background:linear-gradient(135deg,#D97706,#92400E);color:#fff;}
.rk-n{background:var(--bg2);color:var(--text3);}
.rank-it .r-info{flex:1;min-width:0;}
.rank-it .r-nm{font-size:13px;font-weight:600;}
.rank-it .r-dept{font-size:11px;color:var(--text3);}
.rank-it .r-score{font-size:18px;font-weight:800;color:var(--accent);min-width:40px;text-align:right;}

/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input[type=text]{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
.filters select:focus,.filters input:focus{border-color:var(--accent);}
.filters label{font-size:11px;font-weight:600;color:var(--text3);}

/* SETTINGS */
.set-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.set-sec h3{font-size:14px;margin-bottom:12px;}
.tgl-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.tgl-row:last-child{border-bottom:none;}
.tgl-row .tl{font-size:13px;font-weight:500;}
.tgl-row .td{font-size:11px;color:var(--text3);}
.tgl{width:38px;height:20px;background:var(--border2);border-radius:10px;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0;}
.tgl.on{background:var(--accent);}
.tgl::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .15s;}
.tgl.on::after{left:21px;}
.tag-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);min-height:36px;align-items:center;}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--accent-bg);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.tag .tx{cursor:pointer;}
.tag-wrap input{border:none;background:none;font-size:12px;font-family:inherit;outline:none;flex:1;min-width:100px;color:var(--text);}

/* USER GRID CARDS */
.ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.uc{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:18px;box-shadow:var(--shadow);transition:all .15s;}
.uc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow2);}
.uc-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.uc-head .uc-av{width:44px;height:44px;border-radius:12px;font-size:16px;}
.uc-head .uc-info h4{font-size:14px;font-weight:700;font-family:'Source Sans 3',sans-serif;}
.uc-head .uc-info p{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.uc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
.uc-stat{text-align:center;padding:10px 4px;background:var(--bg);border-radius:var(--r);}
.uc-stat .num{font-size:18px;font-weight:800;line-height:1;}
.uc-stat .lbl{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:3px;}
.uc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.uc-foot select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit;background:#fff;color:var(--text);outline:none;cursor:pointer;}
.uc-foot select:focus{border-color:var(--accent);}
.uc-dept{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);margin-bottom:10px;padding:3px 8px;background:var(--bg);border-radius:4px;}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}

@media(max-width:800px){
  .sb{transform:translateX(-100%);}.sb.open{transform:translateX(0);}
  .mn{margin-left:0;}.mob{display:flex!important;}
  .st-grid{grid-template-columns:1fr 1fr;}.fr,.fr3,.g2{grid-template-columns:1fr;}
}

// ================================================================
//  HELPERS
// ================================================================
function stBadge(s){const m={'Cumplida':'b-green','Cumplida parcialmente':'b-purple','En progreso':'b-blue','No cumplida':'b-red','Sin iniciar':'b-muted','No aplica':'b-muted'};return `<span class="badge ${m[s]||'b-muted'}">${s}</span>`;}
function progHTML(v){const c=v>=80?'var(--green)':v>=40?'var(--yellow)':'var(--red)';return `<div class="prog"><div class="prog-bar"><div class="prog-fill" style="width:${v}%;background:${c}"></div></div><span class="prog-txt">${v}%</span></div>`;}
function priBadge(p){return p==='Alta'?'<span class="badge b-red">Alta</span>':p==='Media'?'<span class="badge b-yellow">Media</span>':'<span class="badge b-green">Baja</span>';}
function avH(u,sz=26){return `<div class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.4}px;background:${u.color}">${u.av}</div>`;}
function toast(t,m){const d=document.createElement('div');d.className=`toast ${t}`;d.textContent=m;document.getElementById('toastC').appendChild(d);setTimeout(()=>d.remove(),3000);}
function openModal(h){document.getElementById('mdlC').innerHTML=h;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function calcObjProgress(objId){const acts=D.acts().filter(a=>a.objId===objId);if(!acts.length)return 0;return Math.round(acts.reduce((s,a)=>s+a.prog,0)/acts.length);}
function calcEvalScore(ev){const d=ev.dims;return Math.round((d.cumplimiento*25+d.calidad*25+d.puntualidad*20+d.colaboracion*15+d.iniciativa*15)/100);}
function getChildDepts(pid){const ch=D.depts().filter(d=>d.parent===pid);let ids=ch.map(c=>c.id);ch.forEach(c=>{ids=ids.concat(getChildDepts(c.id));});return ids;}

  document.getElementById('uNm').textContent=S.user.name;

  document.getElementById('uAv').textContent=S.user.av;
  document.getElementById('uAv').style.background=S.user.color;
  buildNav();go('dashboard');
  toast('s','Bienvenido/a, '+S.user.name.split(' ')[0]);
}
function doLogout(){S.user=null;document.getElementById('app').classList.remove('on');document.getElementById('loginScreen').style.display='flex';}

function buildNav(){
  let h='';
  NAV.forEach(sec=>{
    h+=`<div class="sb-lbl">${sec.s}</div>`;
    sec.items.forEach(it=>{
      if(it.r&&!it.r.includes(S.user.role))return;
      const bd=it.badge?`<span class="sb-badge" id="bdg-${it.id}">0</span>`:'';
      h+=`<div class="sb-it" data-pg="${it.id}" onclick="go('${it.id}')"><span class="ic">${it.ic}</span>${it.l}${bd}</div>`;
    });
  });
  document.getElementById('sbMenu').innerHTML=h;
}

function go(pg){
  S.page=pg;
  document.querySelectorAll('.sb-it').forEach(n=>n.classList.toggle('on',n.dataset.pg===pg));
  const T={dashboard:['Dashboard','Resumen general'],activities:['Mis Actividades','Estado de tus actividades asignadas'],meetings:['Reuniones 1:1 / N-1','Reuniones individuales y de equipo'],objectives:['Objetivos de Valor','Objetivos estratégicos, operativos y misionales'],processes:['Procesos','Mapa de procesos institucionales'],org:['Dependencias','Estructura organizacional'],users:['Usuarios','Gestión de usuarios y roles del sistema'],'all-acts':['Todas las Actividades','Vista consolidada'],evals:['Evaluaciones','Evaluaciones trimestrales y semanales'],ranking:['Ranking','Clasificación por desempeño'],reports:['Informes','Métricas e indicadores'],settings:['Configuración','Parámetros del sistema'],alerts:['Notificaciones','Historial de alertas']};
  const[t,st]=T[pg]||['',''];
  document.getElementById('pgT').textContent=t;
  document.getElementById('pgS').textContent=st;
  const canCreate=['Administrador','Gestor'].includes(S.user.role);
  document.getElementById('hdActs').innerHTML=canCreate?`<button class="btn btn-s btn-sm" onclick="exportData()">📥 Exportar</button><button class="btn btn-p btn-sm" onclick="openActForm()">+ Actividad</button>`:`<button class="btn btn-s btn-sm" onclick="exportData()">📥 Exportar</button>`;
  render();
  document.getElementById('sidebar').classList.remove('open');
}

function rMeets(){
  const canC=['Administrador','Gestor'].includes(S.user.role);

    const leader=D.u(m.leader);const partNames=m.parts.map(id=>{const u=D.u(id);return u?u.name.split(' ')[0]:'?';}).join(', ');

    return `<div class="meet"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h4>${m.title}</h4>${stB}</div><div style="font-size:11px;color:var(--text3);margin-bottom:4px">${m.type==='1:1'?'👤':'👥'} ${leader?leader.name.split(' ')[0]:''} → ${partNames} · 📅 ${m.date}</div><ul class="meet-items">${items}</ul>${m.notes?`<div style="margin-top:8px;font-size:11px;color:var(--text2);background:var(--bg);padding:8px;border-radius:6px">💬 ${m.notes}</div>`:''}<div style="margin-top:8px;display:flex;gap:4px"><button class="btn btn-g btn-sm" onclick="editMeet(${m.id})">✏️ Editar</button><button class="btn btn-g btn-sm" onclick="deleteMeet(${m.id})" style="color:var(--red)">🗑</button></div></div>`;
  }).join('');}

  <div class="tabs"><div class="tab on" onclick="switchTab(this,'t11')">🤝 1:1 One-on-One</div><div class="tab" onclick="switchTab(this,'tN1')">👥 N-1 Equipo</div></div>

function switchTab(el,secId){el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');el.closest('.pg-ct,.card-b,.pg').querySelectorAll('.tab-sec').forEach(s=>s.classList.remove('on'));document.getElementById(secId).classList.add('on');}

function toggleMeetItem(mId,idx){const meets=D.meets();const m=meets.find(x=>x.id===mId);if(m){m.items[idx].d=!m.items[idx].d;LS.set('meetings',meets);render();}}

function deleteMeet(id){if(!confirm('¿Eliminar esta reunión?'))return;LS.set('meetings',D.meets().filter(m=>m.id!==id));toast('s','Reunión eliminada');render();}

function rOrg(){
  const topDepts=D.depts().filter(d=>d.parent===null);

    const children=D.depts().filter(d=>d.parent===dept.id);

    const allIds=[dept.id,...getChildDepts(dept.id)];

    return `<div class="dept-block" style="margin-left:${lvl*16}px"><div class="dept-head"><span class="d-icon">${dept.icon}</span><div class="d-info"><h4>${dept.name}</h4><span>${dept.type} · ${totalU} persona${totalU!==1?'s':''}</span></div><div class="d-count">${totalU}</div></div>${userH}${children.map(c=>rTree(c,lvl+1)).join('')}</div>`;
  }
  return topDepts.map(d=>rTree(d)).join('');
}

// ================================================================

// ================================================================
function rUsers(){
  const isAdmin=S.user.role==='Administrador';
  const users=D.users();const depts=D.depts();const acts=D.acts();const evals=D.evals();
  const roles=['Administrador','Gestor','Lector','Usuario'];

  // Group by dept
  const grouped={};users.forEach(u=>{if(!grouped[u.dept])grouped[u.dept]=[];grouped[u.dept].push(u);});

  const totalUsers=users.length;const byRole={};roles.forEach(r=>byRole[r]=users.filter(u=>u.role===r).length);
  const globalAvg=acts.length?Math.round(acts.reduce((s,a)=>s+a.prog,0)/acts.length):0;

  let h=`<div class="st-grid" style="margin-bottom:20px">
    <div class="st"><div class="st-ic" style="background:var(--accent-bg);color:var(--accent)">👥</div><div class="st-v">${totalUsers}</div><div class="st-l">Total Usuarios</div></div>
    <div class="st"><div class="st-ic" style="background:var(--red-bg);color:var(--red)">🛡️</div><div class="st-v">${byRole['Administrador']||0}</div><div class="st-l">Administradores</div></div>
    <div class="st"><div class="st-ic" style="background:var(--green-bg);color:var(--green)">📋</div><div class="st-v">${byRole['Gestor']||0}</div><div class="st-l">Gestores</div></div>
    <div class="st"><div class="st-ic" style="background:var(--purple-bg);color:var(--purple)">👁️</div><div class="st-v">${byRole['Lector']||0}</div><div class="st-l">Lectores</div></div>
    <div class="st"><div class="st-ic" style="background:var(--accent-bg);color:var(--accent)">👤</div><div class="st-v">${byRole['Usuario']||0}</div><div class="st-l">Usuarios</div></div>
    <div class="st"><div class="st-ic" style="background:var(--teal-bg);color:var(--teal)">📊</div><div class="st-v">${globalAvg}%</div><div class="st-l">Avance Global</div></div>
  </div>
  <div class="filters" style="margin-bottom:16px">
    <label>Filtrar:</label>
    <select onchange="filterUC()" id="ufDept"><option value="">Todas las dependencias</option>${depts.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select>
    <select onchange="filterUC()" id="ufRole"><option value="">Todos los roles</option>${roles.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
    <input class="search" id="ufSearch" placeholder="Buscar usuario..." oninput="filterUC()">
  </div>`;

  depts.forEach(dept=>{
    const du=grouped[dept.id];if(!du||!du.length)return;
    h+=`<div class="dept-group" data-dept="${dept.id}"><div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px"><span style="font-size:16px">${dept.icon}</span><h3 style="font-size:14px;font-weight:700">${dept.name}</h3><span class="badge b-muted">${du.length}</span></div><div class="ug">`;
    du.forEach(u=>{
      const ua=acts.filter(a=>a.resp===u.id);const total=ua.length;const done=ua.filter(a=>a.status==='Cumplida').length;const pend=ua.filter(a=>!['Cumplida','No aplica'].includes(a.status)).length;const avg=total?Math.round(ua.reduce((s,a)=>s+a.prog,0)/total):0;
      const ev=evals.find(e=>e.userId===u.id);const evS=ev?calcEvalScore(ev):null;
      const roleSel=isAdmin?`<select onchange="chRole(${u.id},this.value)" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit;background:#fff">${roles.map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}</select>`:`<span class="badge b-blue">${u.role}</span>`;

      h+=`<div class="uc" data-uid="${u.id}" data-role="${u.role}" data-name="${u.name.toLowerCase()}" data-dept="${u.dept}">
        <div class="uc-head"><div class="av uc-av" style="background:${u.color}">${u.av}</div><div class="uc-info"><h4>${u.name}</h4><p>${u.pos}</p><p style="font-size:10px;color:var(--text4)">${u.email}</p></div></div>
        <div class="uc-dept">${dept.icon} ${dept.name}</div>
        <div class="uc-stats"><div class="uc-stat"><div class="num" style="color:var(--accent)">${total}</div><div class="lbl">Actividades</div></div><div class="uc-stat"><div class="num" style="color:var(--green)">${done}</div><div class="lbl">Cumplidas</div></div><div class="uc-stat"><div class="num" style="color:var(--yellow)">${pend}</div><div class="lbl">Pendientes</div></div></div>
        <div style="margin-bottom:10px">${progHTML(avg)}</div>
        ${evS!==null?`<div style="font-size:11px;color:var(--text3);margin-bottom:10px">📝 Evaluación: <b style="color:${evS>=80?'var(--green)':evS>=60?'var(--yellow)':'var(--red)'}">${evS}/100</b></div>`:''}
        <div class="uc-foot">${roleSel}<button class="btn btn-g btn-sm" onclick="viewUser(${u.id})">Ver perfil →</button></div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}

function chRole(uid,newRole){
  const users=D.users();const u=users.find(x=>x.id===uid);if(!u)return;
  if(u.role==='Administrador'&&newRole!=='Administrador'){if(users.filter(x=>x.role==='Administrador').length<=1){toast('e','Debe existir al menos 1 Administrador');render();return;}}
  u.role=newRole;LS.set('users',users);toast('s',`Rol de ${u.name.split(' ')[0]} → ${newRole}`);render();
}

function filterUC(){
  const df=document.getElementById('ufDept').value;const rf=document.getElementById('ufRole').value;const sf=(document.getElementById('ufSearch').value||'').toLowerCase();
  document.querySelectorAll('.uc').forEach(c=>{
    let show=true;
    if(df&&c.dataset.dept!==df)show=false;
    if(rf&&c.dataset.role!==rf)show=false;
    if(sf&&!c.dataset.name.includes(sf))show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.dept-group').forEach(g=>{g.style.display=g.querySelectorAll('.uc:not([style*="display: none"])').length?'':'none';});
}

//  RANKING

function rRanking(){
  const rd=D.users().map(u=>{const ua=D.acts().filter(a=>a.resp===u.id);const actAvg=ua.length?Math.round(ua.reduce((s,a)=>s+a.prog,0)/ua.length):0;const ev=D.evals().find(e=>e.userId===u.id);const evScore=ev?calcEvalScore(ev):0;const comp=Math.round(actAvg*.6+evScore*.4);const dept=D.dept(u.dept);return{u,actAvg,evScore,comp,dept};}).sort((a,b)=>b.comp-a.comp);

  const indH=rd.map((r,i)=>{const pc=i===0?'rk-1':i===1?'rk-2':i===2?'rk-3':'rk-n';const c=r.comp>=80?'var(--green)':r.comp>=60?'var(--yellow)':'var(--red)';return `<div class="rank-it"><div class="rank-pos ${pc}">${i+1}</div>${avH(r.u,30)}<div class="r-info"><div class="r-nm">${r.u.name}</div><div class="r-dept">${r.u.pos} · ${r.dept?r.dept.name.substring(0,25):''}</div></div><div style="text-align:center;min-width:50px"><div style="font-size:13px;font-weight:700">${r.actAvg}%</div><div style="font-size:9px;color:var(--text3)">Activ.</div></div><div style="text-align:center;min-width:50px"><div style="font-size:13px;font-weight:700">${r.evScore||'—'}</div><div style="font-size:9px;color:var(--text3)">Eval.</div></div><div class="r-score" style="color:${c}">${r.comp}</div></div>`;}).join('');

  const deptRd=D.depts().filter(d=>['Subdirección','Coordinación','Jefatura'].includes(d.type)).map(dept=>{const uIds=D.users().filter(u=>u.dept===dept.id).map(u=>u.id);const da=D.acts().filter(a=>uIds.includes(a.resp));const avg=da.length?Math.round(da.reduce((s,a)=>s+a.prog,0)/da.length):0;return{dept,avg,cnt:uIds.length};}).sort((a,b)=>b.avg-a.avg);
  const deptH=deptRd.map((r,i)=>{const pc=i<3?['rk-1','rk-2','rk-3'][i]:'rk-n';const c=r.avg>=70?'var(--green)':r.avg>=40?'var(--yellow)':'var(--red)';return `<div class="rank-it"><div class="rank-pos ${pc}">${i+1}</div><span style="font-size:16px">${r.dept.icon}</span><div class="r-info"><div class="r-nm">${r.dept.name}</div><div class="r-dept">${r.dept.type} · ${r.cnt} personas</div></div><div class="r-score" style="color:${c}">${r.avg}%</div></div>`;}).join('');

  return `<div class="tabs"><div class="tab on" onclick="switchTab(this,'rkInd')">👤 Individual</div><div class="tab" onclick="switchTab(this,'rkDept')">🏢 Por Dependencia</div></div>
  <div class="tab-sec on" id="rkInd"><div class="card"><div class="card-h"><h3>🏆 Ranking Individual</h3><span style="font-size:11px;color:var(--text3)">60% actividades + 40% evaluación</span></div>${indH}</div></div>
  <div class="tab-sec" id="rkDept"><div class="card"><div class="card-h"><h3>🏢 Ranking por Dependencia</h3></div>${deptH}</div></div>`;
}

function rReports(){

function saveAct(editId){
  const desc=document.getElementById('fD').value.trim();
  if(!desc){toast('e','La descripción es obligatoria');return;}
  const prog=parseInt(document.getElementById('fPr').value);
  const status=document.getElementById('fSt').value;
  if(prog===100&&status!=='Cumplida'){toast('w','100% → Estado ajustado a Cumplida');document.getElementById('fSt').value='Cumplida';}
  if(prog===0&&status==='Cumplida'){toast('e','0% no puede ser Cumplida');return;}

  const data={month:document.getElementById('fM').value,week:parseInt(document.getElementById('fW').value),desc,resp:parseInt(document.getElementById('fR').value),by:S.user.id,status:document.getElementById('fSt').value,prog:parseInt(document.getElementById('fPr').value),pri:document.getElementById('fPri').value,objId:parseInt(document.getElementById('fO').value)||null,procId:parseInt(document.getElementById('fP').value)||null,dl:document.getElementById('fDl').value,obs:document.getElementById('fObs').value.trim(),pend:document.getElementById('fPe').value.trim(),dragged:false};

  const acts=D.acts();
  if(editId){
    const idx=acts.findIndex(a=>a.id===editId);
    if(idx>=0){acts[idx]={...acts[idx],...data};LS.set('activities',acts);toast('s','Actividad actualizada');}
  } else {
    let nid=LS.get('nextActId',13);data.id=nid;acts.push(data);LS.set('activities',acts);LS.set('nextActId',nid+1);toast('s','Actividad creada');
  }
  closeModal();render();
}

    <div class="fr"><div class="fg"><label>Líder</label><select class="fsel" id="mL">${uOpts}</select></div>
    <div class="fg"><label>${isN1?'Participantes (ctrl+click)':'Colaborador'}</label><select class="fsel" id="mP" ${isN1?'multiple style="min-height:80px"':''}>${uOpts}</select></div></div>

    <div class="fg"><label>Estado</label><select class="fsel" id="mSt"><option ${m&&m.status==='Pendiente'?'selected':''}>Pendiente</option><option ${m&&m.status==='Completada'?'selected':''}>Completada</option></select></div></div>
    <div class="fg"><label>Puntos de agenda (uno por línea)</label><textarea class="fta" id="mIt" rows="4">${m?m.items.map(i=>i.t).join('\n'):''}</textarea></div>
    <div class="fg"><label>Notas</label><textarea class="fta" id="mN" rows="2">${m?m.notes||'':''}</textarea></div>

  if(m){setTimeout(()=>{document.getElementById('mL').value=m.leader;if(!isN1&&m.parts[0])document.getElementById('mP').value=m.parts[0];},30);}
}

function editMeet(id){const m=D.meets().find(x=>x.id===id);if(m)openMeetForm(m.type,id);}

function saveMeet(type,editId){
  const title=document.getElementById('mT').value.trim();
  if(!title){toast('e','Título obligatorio');return;}
  const sel=document.getElementById('mP');
  const items=document.getElementById('mIt').value.split('\n').filter(l=>l.trim()).map(t=>({t:t.trim(),d:false}));
  const data={type,title,leader:parseInt(document.getElementById('mL').value),parts:type==='1:1'?[parseInt(sel.value)]:Array.from(sel.selectedOptions).map(o=>parseInt(o.value)),date:document.getElementById('mDt').value,status:document.getElementById('mSt').value,notes:document.getElementById('mN').value.trim(),items};
  
  const meets=D.meets();
  if(editId){const idx=meets.findIndex(m=>m.id===editId);if(idx>=0){data.items=meets[idx].items.length===items.length?meets[idx].items:items;meets[idx]={...meets[idx],...data};LS.set('meetings',meets);toast('s','Reunión actualizada');}}
  else{let nid=LS.get('nextMeetId',6);data.id=nid;meets.push(data);LS.set('meetings',meets);LS.set('nextMeetId',nid+1);toast('s','Reunión creada');}
  closeModal();render();
}

function openObjForm(editId){
  const o=editId?D.objs().find(x=>x.id===editId):null;
  const dOpts=D.depts().map(d=>`<option value="${d.id}" ${o&&o.dept===d.id?'selected':''}>${d.name}</option>`).join('');
  const uOpts=D.users().map(u=>`<option value="${u.id}" ${o&&o.owner===u.id?'selected':''}>${u.name}</option>`).join('');
  openModal(`<div class="mdl-hd"><h3>${o?'Editar':'Nuevo'} Objetivo</h3><button class="mdl-x" onclick="closeModal()">✕</button></div>
  <div class="mdl-bd">
    <div class="fg"><label>Nombre <span class="req">*</span></label><textarea class="fta" id="oN" rows="2">${o?o.name:''}</textarea></div>
    <div class="fr3"><div class="fg"><label>Tipo</label><select class="fsel" id="oT"><option ${o&&o.type==='Estratégico'?'selected':''}>Estratégico</option><option ${o&&o.type==='Operativo'?'selected':''}>Operativo</option><option ${o&&o.type==='Misional'?'selected':''}>Misional</option></select></div>
    <div class="fg"><label>Prioridad</label><select class="fsel" id="oPr"><option ${o&&o.pri==='Alta'?'selected':''}>Alta</option><option ${o&&o.pri==='Media'||!o?'selected':''}>Media</option><option ${o&&o.pri==='Baja'?'selected':''}>Baja</option></select></div>
    <div class="fg"><label>Trimestre</label><select class="fsel" id="oQ"><option ${o&&o.quarter==='Q1'?'selected':''}>Q1</option><option ${o&&o.quarter==='Q1-Q2'?'selected':''}>Q1-Q2</option><option ${o&&o.quarter==='Q1-Q3'?'selected':''}>Q1-Q3</option><option ${o&&o.quarter==='Q1-Q4'?'selected':''}>Q1-Q4</option></select></div></div>
    <div class="fr"><div class="fg"><label>Dependencia</label><select class="fsel" id="oD">${dOpts}</select></div><div class="fg"><label>Responsable</label><select class="fsel" id="oO">${uOpts}</select></div></div>
  </div>
  <div class="mdl-ft"><button class="btn btn-s" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="saveObj(${editId||'null'})">${o?'Actualizar':'Guardar'}</button></div>`);
}

function editObj(id){openObjForm(id);}

function saveObj(editId){
  const name=document.getElementById('oN').value.trim();
  if(!name){toast('e','Nombre obligatorio');return;}
  const data={name,type:document.getElementById('oT').value,pri:document.getElementById('oPr').value,quarter:document.getElementById('oQ').value,dept:document.getElementById('oD').value,owner:parseInt(document.getElementById('oO').value)};
  const objs=D.objs();
  if(editId){const idx=objs.findIndex(o=>o.id===editId);if(idx>=0){objs[idx]={...objs[idx],...data};LS.set('objectives',objs);toast('s','Objetivo actualizado');}}
  else{data.id=(objs.length?Math.max(...objs.map(o=>o.id)):0)+1;objs.push(data);LS.set('objectives',objs);toast('s','Objetivo creado');}
  closeModal();render();
}

// ================================================================
//  FORM: EVALUATION
// ================================================================
function openEvalForm(){
  const uOpts=D.users().filter(u=>u.role==='Usuario').map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
  openModal(`<div class="mdl-hd"><h3>Nueva Evaluación</h3><button class="mdl-x" onclick="closeModal()">✕</button></div>
  <div class="mdl-bd">
    <div class="fr"><div class="fg"><label>Colaborador</label><select class="fsel" id="evU">${uOpts}</select></div><div class="fg"><label>Periodo</label><input class="fi" id="evP" value="Q1 2026"></div></div>
    <div class="fg"><label>Tipo</label><select class="fsel" id="evT"><option>Trimestral</option><option>Semanal</option></select></div>
    <p style="font-size:12px;font-weight:700;color:var(--text2);margin:12px 0 8px">Dimensiones (0-100)</p>
    <div class="fr"><div class="fg"><label>Cumplimiento</label><input type="number" class="fi" id="evD1" min="0" max="100" value="75"></div><div class="fg"><label>Calidad</label><input type="number" class="fi" id="evD2" min="0" max="100" value="75"></div></div>
    <div class="fr"><div class="fg"><label>Puntualidad</label><input type="number" class="fi" id="evD3" min="0" max="100" value="75"></div><div class="fg"><label>Colaboración</label><input type="number" class="fi" id="evD4" min="0" max="100" value="75"></div></div>
    <div class="fg"><label>Iniciativa</label><input type="number" class="fi" id="evD5" min="0" max="100" value="75"></div>
  </div>
  <div class="mdl-ft"><button class="btn btn-s" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="saveEval()">Guardar</button></div>`);
}

function saveEval(){
  const dims={cumplimiento:parseInt(document.getElementById('evD1').value)||0,calidad:parseInt(document.getElementById('evD2').value)||0,puntualidad:parseInt(document.getElementById('evD3').value)||0,colaboracion:parseInt(document.getElementById('evD4').value)||0,iniciativa:parseInt(document.getElementById('evD5').value)||0};
  const evals=D.evals();
  let nid=LS.get('nextEvalId',9);
  evals.push({id:nid,userId:parseInt(document.getElementById('evU').value),period:document.getElementById('evP').value,type:document.getElementById('evT').value,dims,by:S.user.id,date:new Date().toISOString().split('T')[0]});
  LS.set('evaluations',evals);LS.set('nextEvalId',nid+1);
  closeModal();toast('s','Evaluación registrada');render();
}

// ================================================================
//  USER PROFILE
// ================================================================
function viewUser(uid){
  const u=D.u(uid);if(!u)return;const dept=D.dept(u.dept);const acts=D.acts().filter(a=>a.resp===uid);const avg=acts.length?Math.round(acts.reduce((s,a)=>s+a.prog,0)/acts.length):0;const done=acts.filter(a=>a.status==='Cumplida').length;const pend=acts.filter(a=>!['Cumplida','No aplica'].includes(a.status)).length;const ev=D.evals().find(e=>e.userId===uid);const evScore=ev?calcEvalScore(ev):'—';
  openModal(`<div class="mdl-hd"><h3>Perfil</h3><button class="mdl-x" onclick="closeModal()">✕</button></div>
  <div class="mdl-bd"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">${avH(u,42)}<div><div style="font-weight:700;font-size:16px">${u.name}</div><div style="font-size:12px;color:var(--text2)">${u.pos}</div><div style="font-size:11px;color:var(--text3)">${u.email}</div></div></div>
  <div style="display:flex;gap:4px;margin-bottom:14px"><span class="badge b-blue">${u.role}</span><span class="badge b-muted">${dept?dept.name:''}</span></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px"><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px"><div style="font-size:20px;font-weight:800;color:var(--accent)">${acts.length}</div><div style="font-size:9px;color:var(--text3)">Total</div></div><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px"><div style="font-size:20px;font-weight:800;color:var(--green)">${done}</div><div style="font-size:9px;color:var(--text3)">Cumplidas</div></div><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px"><div style="font-size:20px;font-weight:800;color:var(--yellow)">${pend}</div><div style="font-size:9px;color:var(--text3)">Pendientes</div></div><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px"><div style="font-size:20px;font-weight:800;color:var(--accent)">${avg}%</div><div style="font-size:9px;color:var(--text3)">Avance</div></div></div>
  ${ev?`<p style="font-size:12px;font-weight:700;margin-bottom:6px">Evaluación ${ev.period}: <span style="color:var(--accent)">${evScore}/100</span></p>`:''}</div>
  <div class="mdl-ft"><button class="btn btn-s" onclick="closeModal()">Cerrar</button></div>`);
}

// ================================================================
//  UTILITIES
// ================================================================
function filterTbl(q,id){document.querySelectorAll('#'+id+' tr').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none';});}
function exportData(){toast('i','Generando archivo...');setTimeout(()=>toast('s','Archivo exportado'),1000);}
function resetData(){if(!confirm('¿Restablecer todos los datos?'))return;Object.keys(localStorage).forEach(k=>{if(k.startsWith('iets_'))localStorage.removeItem(k);});seedIfNeeded();toast('s','Datos restablecidos');render();}

// ================================================================
//  INIT
// ================================================================
seedIfNeeded();
</script>
</body>
</html>
