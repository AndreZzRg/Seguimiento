<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IETS — Gestión Integral</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Toast Container -->
<div class="toast-c" id="toastC"></div>

<!-- Loading Screen (while sql.js initializes) -->
<div id="loadingScreen">
  <div class="loading-inner">
    <div class="spinner"></div>
    <p>Cargando base de datos SQLite...</p>
  </div>
</div>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">IE</div>
    <h1>Gestión Integral IETS</h1>
    <p>Seguimiento semanal, objetivos, reuniones 1:1, evaluaciones y gestión por dependencias.</p>
    <button class="g-btn" onclick="doLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Iniciar con Google Workspace
    </button>
    <p class="hint">Solo cuentas <b>@iets.org.co</b></p>
    <div class="demo-sel">
      <label>Demo — Iniciar como:</label>
      <select id="demoUser">
        <option value="1">Adriana Robayo — Administrador (Dir. Ejecutiva)</option>
        <option value="2">Valentina Acosta — Gestor (Subdir. Técnica)</option>
        <option value="7">Andrés Torres — Gestor (Subdir. Administrativa)</option>
        <option value="10">Paula Moreno — Gestor (Subdir. PID)</option>
        <option value="3">Carlos Méndez — Usuario (Coord. ETS)</option>
        <option value="5">Diego Ramírez — Lector (Coord. Calidad)</option>
      </select>
    </div>
  </div>
</div>

<!-- App Shell -->
<div id="app">
  <aside class="sb" id="sidebar">
    <div class="sb-top">
      <div class="ico">IE</div>
      <div>
        <div class="t">IETS Tracker</div>
        <div class="s">Gestión integral · SQLite</div>
      </div>
    </div>
    <nav class="sb-menu" id="sbMenu"></nav>
    <div class="sb-bot">
      <div class="av" id="uAv" style="width:30px;height:30px;font-size:11px;background:var(--accent)">—</div>
      <div class="info">
        <div class="nm" id="uNm">—</div>
        <div class="rl" id="uRl">—</div>
      </div>
      <button class="lo" onclick="doLogout()" title="Cerrar sesión">⏻</button>
    </div>
  </aside>
  <div class="mn">
    <header class="mn-hd">
      <div style="display:flex;align-items:center">
        <button class="mob" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div>
          <h1 id="pgT">—</h1>
          <div class="sub" id="pgS">—</div>
        </div>
      </div>
      <div class="hd-acts" id="hdActs"></div>
    </header>
    <div class="pg-ct" id="pageContainer"></div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="mdl-ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mdl" id="mdlC"></div>
</div>

<!-- Scripts: sql.js (SQLite WASM) then our modules -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
